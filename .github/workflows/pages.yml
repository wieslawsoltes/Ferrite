name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read
  deploy:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout validated commit
        uses: actions/checkout@v4
      - name: Archive exact deployment source
        run: git archive --format=zip HEAD -o "$RUNNER_TEMP/ferrite-source.zip"
      - name: Retain deployment source
        uses: actions/upload-artifact@v4
        with:
          name: ferrite-source
          path: ${{ runner.temp }}/ferrite-source.zip
          retention-days: 7
      - name: Prepare the static site only
        run: |
          mkdir .pages-site
          cp index.html .pages-site/
          cp -R styles src .pages-site/
          touch .pages-site/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload validated static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .pages-site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
