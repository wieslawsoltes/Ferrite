name: Prepare terminal dependencies
on:
  push:
    branches: [automation/terminal-assets-20261009]
    paths: [.github/workflows/terminal-assets.yml]
permissions:
  contents: read
jobs:
  assets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch exact upstream npm distributions without running package scripts
        run: |
          mkdir -p terminal-packages
          cd terminal-packages
          npm pack --ignore-scripts --json @xterm/xterm@6.0.0 @xterm/headless@6.0.0 @xterm/addon-fit@0.11.0 @xterm/addon-search@0.16.0 @xterm/addon-unicode11@0.9.0 @xterm/addon-serialize@0.14.0 @xterm/addon-webgl@0.19.0 > manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: terminal-packages
          path: terminal-packages/
          retention-days: 7
