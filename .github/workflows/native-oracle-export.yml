name: Retain native compiler oracle
on:
  push:
    branches: [automation/compiler-associated-types-delivery]
    paths: ['.github/workflows/native-oracle-export.yml']
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Prepare native Rust compiler
        run: |
          rustup toolchain install stable --profile minimal
          rustup run stable rustc --version --verbose > rustc-version.txt
          TOOLCHAIN=$(dirname "$(dirname "$(rustup which --toolchain stable rustc)")")
          tar -C "$TOOLCHAIN" -cJf rustc-native-oracle.tar.xz bin/rustc lib/librustc_driver*.so lib/libLLVM*.so* lib/rustlib/x86_64-unknown-linux-gnu/lib
          sha256sum rustc-native-oracle.tar.xz > rustc-native-oracle.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: rustc-native-oracle
          path: |
            rustc-native-oracle.tar.xz
            rustc-native-oracle.sha256
            rustc-version.txt
          compression-level: 0
          retention-days: 7
