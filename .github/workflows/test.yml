name: Compiler and IDE Validation

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Retain the exact validation source for reproducible failures
        run: |
          mkdir -p artifacts/source
          git archive --format=zip HEAD -o artifacts/source/checkout.zip
          git rev-parse HEAD > artifacts/source/commit.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify syntax, deterministic worker/SDK bundles and pinned terminal assets
        run: npm run check
      - name: Run compiler, runtime, project, service and sample tests
        run: npm test
      - name: Validate public SDK and JSX declarations with pinned TypeScript
        run: |
          npm install --global typescript@5.8.3
          npm run test:ui:types
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare Chromium and the native Rust toolchain
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
          rustup toolchain install stable --profile minimal --component rustfmt --component rust-analyzer --component rust-src
          rustup default stable
          rustup target add wasm32-unknown-unknown
      - name: Verify readable sample source formatting
        run: |
          rustup toolchain install 1.90.0 --profile minimal --component rustfmt
          npm run format:samples:check
      - name: Compile and test the standard-Rust UI workspace offline
        run: |
          set -o pipefail
          mkdir -p artifacts/native-ui
          cargo test --manifest-path rust-ui/Cargo.toml --offline --locked 2>&1 | tee artifacts/native-ui/cargo-test.log
          npm run build:ui:native -- --trust-projects --offline 2>&1 | tee artifacts/native-ui/cargo-build.log
          npm run test:ui:native
      - name: Differentially validate language semantics against installed rustc
        run: npm run test:language
      - name: Exercise installed Cargo over an offline local workspace
        run: |
          npm run test:native
          npm run test:repositories
      - name: Exercise the HTTP IDE and authenticated Cargo bridge in Chromium
        env:
          FERRITE_NATIVE_TEST: '1'
        run: npm run test:browser
      - name: Exercise compiler output for samples, UI builds, cold reload and retained views
        run: npm run test:compiler-output
      - name: Exercise agent login, MCP, native PTY and ncurses keyboard/mouse/resize/reconnect in Chromium
        run: npm run test:agent:browser
      - name: Exercise bridge-free browser agents, persistence, review and terminal harness
        run: |
          set -o pipefail
          npm run test:browser-agent 2>&1 | tee artifacts/browser-agent.log
      - name: Exercise bridge-free Rust and view editor language tooling over HTTP
        run: npm run test:editor-language
      - name: Exercise UI Studio, JSX/compiler SDK and offline exports in Chromium
        run: |
          set -o pipefail
          npm run test:ui:browser 2>&1 | tee artifacts/ui-browser.log
      - name: Exercise all seven GUIs, sample browsing and offline JS/MIR/Wasm exports
        run: |
          set -o pipefail
          node tools/seven-guis-native.mjs
          npm run test:7guis:browser 2>&1 | tee artifacts/seven-guis.log
      - name: Exercise first-party SSR and hydration in Chromium
        run: npm run test:ui:rendering
      - name: Exercise actual React, Radix, concurrent rendering and server streams
        run: |
          npm ci --prefix tests/react-reference --ignore-scripts
          npm run test:ui:react
      - name: Record environment-dependent compiler timings
        run: |
          mkdir -p artifacts/performance
          node tools/benchmark.mjs 25 > artifacts/performance/benchmark.txt
          node tools/benchmark-verifier.mjs --baseline-ref 5f74745d294dc6ccb372bfd915883455c12160f2 --iterations 25 --output artifacts/performance/verifier.json
          node --version > artifacts/performance/environment.txt
          cargo --version >> artifacts/performance/environment.txt
          rustc --version >> artifacts/performance/environment.txt
      - name: Retain screenshots and validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ferrite-validation-${{ github.sha }}
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 14
