name: Publish compiler constants continuation
on:
  push:
    branches: [automation/compiler-associated-constants-delivery]
    paths: ['.compiler-transfer/**', '.github/workflows/compiler-constants-delivery.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TARGET_BRANCH: feat/compiler-associated-constants
      EXPECTED_HEAD: fb52e74d429a8ea7be1eeeb095e6471eb7c3078d
      EXPECTED_TREE: e10fa4fd0b9ace9827fde69465fe394ea42e49d6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Decode and verify source patch
        run: |
          python3 - <<'PY'
          import base64, hashlib, lzma, os
          from pathlib import Path
          encoded = Path('.compiler-transfer/constants-native-fixes.xz.b64').read_text().strip()
          patch = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '0c276a699ea288b1f78eb3631661de266dfe89e3fa3f4d48bcdae5d64c9d5e07'
          Path(os.environ['RUNNER_TEMP'], 'compiler-constants.patch').write_bytes(patch)
          PY
      - uses: actions/checkout@v4
        with:
          ref: feat/compiler-associated-constants
      - name: Apply and regenerate exact tree
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git apply --check --unidiff-zero --whitespace=error-all "$RUNNER_TEMP/compiler-constants.patch"
          git apply --index --unidiff-zero --whitespace=error-all "$RUNNER_TEMP/compiler-constants.patch"
          npm run build:workers
          npm run build:sdk
          git add -A
          git diff --cached --check
          test "$(git write-tree)" = "$EXPECTED_TREE"
      - name: Validate publication
        run: |
          npm run check
          node --test --test-concurrency=4 tests/*.test.js
      - name: Commit and non-force push
        run: |
          test "$(git write-tree)" = "$EXPECTED_TREE"
          git config user.name 'Wiesław Šoltés'
          git config user.email 'wieslawsoltes@users.noreply.github.com'
          git commit -m 'fix: match native Rust constant dependencies and generic scalar patterns'
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          git rev-parse HEAD HEAD^{tree}
