name: Publish verified compiler commits
on:
  push:
    branches: [automation/ferrite-language-publish]
    paths: [.github/compiler-payload.b64]
permissions:
  contents: write
  actions: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore and verify focused feature commits
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib, json, os, re, subprocess, tempfile
          from pathlib import Path
          evidence = Path(os.environ['RUNNER_TEMP']) / 'compiler-publication'
          evidence.mkdir()
          manifest = json.loads(Path('.github/compiler-payload.b64').read_text())
          if 'inline' in manifest:
              payload = manifest['inline']
          else:
              chunks = manifest['chunks']
              if len(chunks) > 64 or any(not re.fullmatch(r'\.github/compiler-payload-[a-z0-9-]+\.b64', path) for path in chunks):
                  raise SystemExit('Invalid publication chunks')
              encoded = ''.join(Path(path).read_text().strip() for path in chunks)
              (evidence / 'transport-original.b64').write_text(encoded)
              for repair in manifest.get('repairs', []):
                  if encoded.count(repair['old']) != 1:
                      raise SystemExit('Transport repair must match exactly once')
                  encoded = encoded.replace(repair['old'], repair['new'], 1)
              (evidence / 'transport-repaired.b64').write_text(encoded)
              compressed = base64.b64decode(encoded, validate=True)
              if hashlib.sha256(compressed).hexdigest() != manifest['sha256']:
                  raise SystemExit('Payload digest mismatch')
              payload = json.loads(gzip.decompress(compressed))
          (evidence / 'payload.json').write_text(json.dumps(payload))
          target = payload.get('target', 'feat/compiler-language-toolchain')
          if target not in ['feat/compiler-language-toolchain', 'feat/compiler-destructuring-assignment', 'feat/compiler-nominal-constructors', 'feat/compiler-enum-records', 'feat/compiler-callable-items', 'feat/compiler-range-values', 'feat/compiler-delayed-initialization']:
              raise SystemExit('Invalid feature branch')
          def git(*args, **kwargs):
              return subprocess.check_output(['git', *args], **kwargs).decode().strip()
          expected = payload['base']
          remote = git('ls-remote', 'origin', 'refs/heads/' + target).split()[0]
          if remote != expected:
              raise SystemExit('Target branch moved; refusing to overwrite concurrent work')
          git('config', 'user.name', 'Wiesław Šoltés')
          git('config', 'user.email', 'wieslawsoltes@users.noreply.github.com')
          git('checkout', '--detach', expected)
          for change in payload['commits']:
              if change.get('merge'):
                  merged = subprocess.run(['git', 'merge', '--no-commit', '--no-ff', change['merge']])
                  if merged.returncode:
                      conflicts = git('diff', '--name-only', '--diff-filter=U').splitlines()
                      if not conflicts or any(not re.fullmatch(r'src/ui/workers/[a-z-]+\.bundle\.js', p) for p in conflicts):
                          raise SystemExit('Unexpected source merge conflict')
                      git('checkout', '--ours', '--', *conflicts)
                      git('add', '--', *conflicts)
              if change.get('patch'):
                  with tempfile.NamedTemporaryFile(suffix='.patch') as patch:
                      patch.write(change['patch'].encode()); patch.flush()
                      git('apply', '--index', '--whitespace=error', patch.name)
              subprocess.run(['npm', 'run', 'build:workers'], check=True)
              git('add', 'src/ui/workers')
              tree = git('write-tree')
              if tree != change['tree']:
                  raise SystemExit('Source tree mismatch: ' + tree)
              if manifest.get('sourceOnly'):
                  (evidence / 'workflow-change.patch').write_text(git('diff', '--cached', '--', '.github/workflows') + '\n')
                  git('restore', '--source=HEAD', '--staged', '--worktree', '--', '.github/workflows')
              if git('diff', '--cached', '--name-only', '--', '.github/workflows'):
                  raise SystemExit('Workflow changes require a separately authorized workflow edit')
              git('commit', '-m', change['message'])
          git('archive', '--format=zip', 'HEAD', '-o', str(evidence / 'checkout.zip'))
          (evidence / 'commit.txt').write_text(git('rev-parse', 'HEAD'))
          (evidence / 'tree.txt').write_text(git('write-tree'))
          subprocess.run(['npm', 'run', 'check'], check=True)
          subprocess.run(['npm', 'test'], check=True)
          git('push', 'origin', 'HEAD:refs/heads/' + target)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('target=' + target + '\n')
          Path(os.environ['GITHUB_STEP_SUMMARY']).write_text('Published `' + git('rev-parse', 'HEAD') + '`; tree `' + git('write-tree') + '`. No workflows were changed.\n')
          PY
        id: publish
      - name: Dispatch the full feature-branch validation
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ steps.publish.outputs.target }}
        run: gh workflow run test.yml --ref "$TARGET"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compiler-publication
          path: ${{ runner.temp }}/compiler-publication/
          retention-days: 7
