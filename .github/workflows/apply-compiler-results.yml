name: Apply verified compiler-output integration
on:
  push:
    branches: [fix/compiler-output-visualizations]
    paths: ['.github/compiler-results/**']
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify and apply reviewed source delta
        run: |
          set -euo pipefail
          echo 'c0325e9266c9d7890474753f70bba07349cf816e2610218647be7f43455e4b71  .github/compiler-results/merge.patch.gz' | sha256sum --check
          gzip -dc .github/compiler-results/merge.patch.gz > /tmp/merge.patch
          git apply --check /tmp/merge.patch
          git apply --index /tmp/merge.patch
          git diff --cached --check
      - name: Validate implementation before publishing
        run: |
          npm run check
          npm test
      - name: Publish only the feature branch
        run: |
          git config user.name 'Wiesław Šoltés'
          git config user.email 'wieslawsoltes@users.noreply.github.com'
          git commit -m 'fix: preserve startup docking preferences and exercise component canvas with compiler visible'
          git push origin HEAD:refs/heads/fix/compiler-output-visualizations
