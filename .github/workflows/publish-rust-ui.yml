name: Publish verified Rust UI commits
on:
  push:
    branches: [automation/rust-ui-publish-20261009]
    paths: [.github/ui-payload.json]
permissions:
  contents: write
  actions: write
concurrency:
  group: ferrite-ui-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore focused commits and verify exact source trees
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib, json, os, re, subprocess, tempfile
          from pathlib import Path
          evidence = Path(os.environ['RUNNER_TEMP']) / 'ui-publication'
          evidence.mkdir()
          manifest = json.loads(Path('.github/ui-payload.json').read_text())
          chunks = manifest['chunks']
          if len(chunks) > 64 or any(not re.fullmatch(r'\.github/ui-payload-[a-z0-9-]+\.b64', name) for name in chunks):
              raise SystemExit('Invalid payload paths')
          encoded = ''.join(Path(name).read_text().strip() for name in chunks)
          (evidence / 'transport.b64').write_text(encoded)
          for repair in manifest.get('repairs', []):
              if not repair['old'] or encoded.count(repair['old']) != 1:
                  raise SystemExit('Transport correction must match exactly once')
              encoded = encoded.replace(repair['old'], repair['new'], 1)
          data = base64.b64decode(encoded, validate=True)
          if hashlib.sha256(data).hexdigest() != manifest['sha256']:
              raise SystemExit('Payload digest mismatch')
          payload = json.loads(gzip.decompress(data))
          if payload['target'] != 'feat/rust-ui-studio':
              raise SystemExit('Unexpected target branch')
          (evidence / 'payload.json').write_text(json.dumps(payload))
          def git(*args):
              return subprocess.check_output(['git', *args]).decode().strip()
          target = payload['target']
          remote = git('ls-remote', 'origin', 'refs/heads/' + target).split()[0]
          if remote != payload['base']:
              raise SystemExit('Target moved; refusing to overwrite concurrent work')
          git('config', 'user.name', 'Wiesław Šoltés')
          git('config', 'user.email', 'wieslawsoltes@users.noreply.github.com')
          git('checkout', '--detach', payload['base'])
          for change in payload['commits']:
              if change.get('merge'):
                  git('merge', '--no-commit', '--no-ff', change['merge'])
              if change.get('patch'):
                  with tempfile.NamedTemporaryFile(suffix='.patch') as patch:
                      patch.write(change['patch'].encode()); patch.flush()
                      git('apply', '--index', '--whitespace=error', patch.name)
              subprocess.run(['node', 'tools/bundle-workers.mjs'], check=True)
              git('add', 'src/ui/workers')
              if Path('tools/bundle-sdk.mjs').exists():
                  subprocess.run(['node', 'tools/bundle-sdk.mjs'], check=True)
                  git('add', 'src/sdk')
              if git('diff', '--cached', '--name-only', '--', '.github/workflows'):
                  raise SystemExit('Workflow edits must be separately authorized')
              tree = git('write-tree')
              if tree != change['tree']:
                  raise SystemExit('Exact tree mismatch: ' + tree + ' expected ' + change['tree'])
              git('commit', '-m', change['message'])
          subprocess.run(['npm', 'run', 'check'], check=True)
          subprocess.run(['npm', 'test'], check=True)
          git('archive', '--format=zip', 'HEAD', '-o', str(evidence / 'checkout.zip'))
          (evidence / 'commit.txt').write_text(git('rev-parse', 'HEAD'))
          (evidence / 'tree.txt').write_text(git('write-tree'))
          git('push', 'origin', 'HEAD:refs/heads/' + target)
          Path(os.environ['GITHUB_STEP_SUMMARY']).write_text('Published `' + git('rev-parse', 'HEAD') + '`; exact tree `' + git('write-tree') + '`. Publication scaffolding is not in the feature branch.\n')
          PY
      - name: Dispatch full feature validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run test.yml --ref feat/rust-ui-studio
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-publication
          path: ${{ runner.temp }}/ui-publication/
          retention-days: 7
