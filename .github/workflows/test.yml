name: Compiler Tests
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: compiler-ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/check-syntax.mjs
      - run: npm test
