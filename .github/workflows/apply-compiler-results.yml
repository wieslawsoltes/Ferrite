name: Integrate verified compiler results with retained docking
on:
  push:
    branches: [fix/compiler-output-visualizations]
    paths: ['.github/compiler-results/**']
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify and apply the locally tested merge resolution
        run: |
          set -euo pipefail
          echo '9aefa51b3d30d2c9982695c2f4cda90c913c8d0768dbb5069f5011faaa622491  .github/compiler-results/merge.patch.gz' | sha256sum --check
          gzip -dc .github/compiler-results/merge.patch.gz > /tmp/merge.patch
          git apply --check /tmp/merge.patch
          git apply --index /tmp/merge.patch
          git diff --cached --check
      - name: Verify implementation before publishing
        run: |
          npm run check
          npm test
      - name: Publish only the feature branch
        run: |
          git config user.name 'Wiesław Šoltés'
          git config user.email 'wieslawsoltes@users.noreply.github.com'
          git commit -m 'fix: integrate compiler output with retained docking and reselect agent in sample regression'
          git push origin HEAD:refs/heads/fix/compiler-output-visualizations
