name: Materialize verified compiler-results changes

on:
  push:
    branches: [fix/compiler-output-visualizations]
    paths: ['.github/compiler-results/**']

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify and apply the locally tested source delta
        run: |
          set -euo pipefail
          cat .github/compiler-results/part-*.bin > /tmp/compiler-results.patch.gz
          echo '74ed28dfbf6debe6172d71528d87c556d143631f2e2855b8349a61ff034046ce  /tmp/compiler-results.patch.gz' | sha256sum --check
          gzip -dc /tmp/compiler-results.patch.gz > /tmp/compiler-results.patch
          git apply --check --exclude=.github/workflows/test.yml /tmp/compiler-results.patch
          git apply --index --exclude=.github/workflows/test.yml /tmp/compiler-results.patch
      - name: Regenerate checked-in worker and SDK assets
        run: |
          node tools/bundle-workers.mjs
          node tools/bundle-sdk.mjs
          git add src/ui/workers/compile-worker.bundle.js src/ui/workers/agent-compiler-worker.bundle.js src/sdk/ferrite.bundle.js
          git diff --cached --check
      - name: Validate before publishing implementation
        run: |
          npm run check
          npm test
      - name: Publish only the feature branch
        run: |
          git config user.name 'Wiesław Šoltés'
          git config user.email 'wieslawsoltes@users.noreply.github.com'
          git commit -m 'fix: reject obsolete UI build failures after compiler settings change'
          git push origin HEAD:refs/heads/fix/compiler-output-visualizations
          mkdir -p artifacts/compiler-results-source
          git archive --format=zip HEAD -o artifacts/compiler-results-source/source.zip
          git rev-parse HEAD > artifacts/compiler-results-source/commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: compiler-results-source
          path: artifacts/compiler-results-source/
          retention-days: 3
