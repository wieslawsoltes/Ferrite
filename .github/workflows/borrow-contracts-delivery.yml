name: Publish checked borrow contracts
on:
  push:
    branches: [automation/borrow-call-contracts-delivery]
    paths: ['.compiler-transfer/budget-correction.b64', '.github/workflows/borrow-contracts-delivery.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_HEAD: d147485611cac6b6cfdea5ce17cf1fd3cd226c28
      EXPECTED_TREE: 963b1667acad8d59c1bfac8fcbdb00ae1d6f7c3a
      TARGET_BRANCH: feat/borrow-call-contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Decode and verify reviewed correction
        run: |
          python3 - <<'PY'
          import base64, hashlib, lzma, os
          from pathlib import Path
          encoded = Path('.compiler-transfer/budget-correction.b64').read_text().strip()
          patch = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'd88342bfe7e4b9ee424713360589dc5f093c8b064376f1ddb2ec15ac191e31fd'
          Path(os.environ['RUNNER_TEMP'], 'borrow-correction.patch').write_bytes(patch)
          PY
      - uses: actions/checkout@v4
        with:
          ref: feat/borrow-call-contracts
      - name: Reconstruct exact reviewed correction
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git apply --check --unidiff-zero --whitespace=error-all "$RUNNER_TEMP/borrow-correction.patch"
          git apply --index --unidiff-zero --whitespace=error-all "$RUNNER_TEMP/borrow-correction.patch"
          npm run build:workers
          npm run build:sdk
          git add -A
          git diff --cached --check
          test "$(git write-tree)" = "$EXPECTED_TREE"
      - name: Validate corrected publication
        run: |
          npm run check > "$RUNNER_TEMP/borrow-check.log" 2>&1
          node --test --test-concurrency=4 tests/*.test.js > "$RUNNER_TEMP/borrow-tests.log" 2>&1
          tail -n 12 "$RUNNER_TEMP/borrow-tests.log"
          test "$(git write-tree)" = "$EXPECTED_TREE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: borrow-contracts-publication
          path: |
            ${{ runner.temp }}/borrow-check.log
            ${{ runner.temp }}/borrow-tests.log
          retention-days: 7
      - name: Commit and non-force publish correction
        run: |
          test "$(git write-tree)" = "$EXPECTED_TREE"
          git config user.name 'Wiesław Šoltés'
          git config user.email 'wieslawsoltes@users.noreply.github.com'
          git commit -m 'fix: charge direct generic input traversal to signature work budget'
          test -z "$(git status --porcelain)"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          git rev-parse HEAD HEAD^{tree}
