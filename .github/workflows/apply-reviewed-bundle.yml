name: Validate and commit reviewed source
on:
  push:
    branches: [main]
    paths: ['.github/rewrite/*.b64']
permissions:
  contents: write
concurrency:
  group: reviewed-source-publish
  cancel-in-progress: false
jobs:
  validate-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Materialize hash-verified source changes
        id: apply
        run: node tools/apply-reviewed-bundle.mjs
      - name: Build deterministic worker bundles
        run: |
          if test -f tools/bundle-workers.mjs; then node tools/bundle-workers.mjs; fi
      - name: Validate all JavaScript modules
        run: node tools/check-syntax.mjs
      - name: Test the complete source batch
        run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare Chromium and native Cargo
        run: |
          if test -f tools/browser-acceptance.py; then
            python -m pip install playwright==1.57.0
            python -m playwright install --with-deps chromium
            rustup toolchain install stable --profile minimal --component rustfmt
            rustup default stable
          fi
      - name: Validate actual native Cargo
        run: |
          if test -f tools/native-smoke.mjs; then node tools/native-smoke.mjs; fi
      - name: Validate complete HTTP IDE and native bridge in Chromium
        env:
          FERRITE_NATIVE_TEST: '1'
        run: |
          if test -f tools/browser-acceptance.py; then python tools/browser-acceptance.py; fi
      - name: Retain validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rewrite-validation
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7
      - name: Commit validated source atomically
        env:
          MESSAGE: ${{ steps.apply.outputs.message }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "$MESSAGE"
          git push origin HEAD:main
          echo "Published source commit $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
