name: Publish nominal variance continuation
on:
  push:
    branches: [automation/compiler-variance-delivery]
    paths: ['.compiler-transfer/**', '.github/workflows/variance-delivery.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TARGET_BRANCH: feat/compiler-nominal-variance
      EXPECTED_HEAD: 3479b9d29529070b8196d7497c6f673c1bd320a5
      PREVIOUS_TREE: 009c2defe27486750c5af6dd4d288f072b460405
      EXPECTED_TREE: fa7dd561d8f912ea472daa94caec3f69805280a0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Decode and verify source patches
        run: |
          python3 - <<'PY'
          import base64, hashlib, lzma, os
          from pathlib import Path
          encoded = ''.join(Path(f'.compiler-transfer/variance.{i}.b64').read_text().strip() for i in range(3))
          patch = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'bc0ae47edc9e7c9fc40f89960cef2c3eb068b199b526fe5a7dae9755c0dde8bc'
          # Reconstruct the separately committed trailing-empty-line correction.
          start = patch.index(b'diff --git a/tests/fixtures/nominal-variance.js ')
          end = patch.index(b'diff --git ', start + 1)
          block = patch[start:end]
          assert block.endswith(b'+];\n+\n')
          block = block.replace(b'index 0000000..c78976f\n', b'index 0000000..4a9976f\n').replace(b'@@ -0,0 +1,116 @@\n', b'@@ -0,0 +1,115 @@\n')[:-2]
          patch = patch[:start] + block + patch[end:]
          assert hashlib.sha256(patch).hexdigest() == 'f2e9b2b1d5f6b3076887728a253c8bbc6eb5b3e5e8847adb36d77e32028e16b1'
          Path(os.environ['RUNNER_TEMP'], 'variance.patch').write_bytes(patch)
          fix = Path('.compiler-transfer/variance-debugger.patch').read_bytes()
          assert hashlib.sha256(fix).hexdigest() == 'adde5c19a990e9653ba42f06004a8b02212cd396973d866171ead4472a037812'
          Path(os.environ['RUNNER_TEMP'], 'variance-debugger.patch').write_bytes(fix)
          PY
      - uses: actions/checkout@v4
        with:
          ref: feat/compiler-nominal-variance
          fetch-depth: 0
      - name: Apply and regenerate exact tree
        run: |
          if test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"; then
            git apply --check --whitespace=error-all "$RUNNER_TEMP/variance.patch"
            git apply --index --whitespace=error-all "$RUNNER_TEMP/variance.patch"
          else
            # A previous queued publisher may have committed the exact pre-fix
            # tree. Only that verified single-parent continuation is accepted.
            test "$(git rev-parse HEAD^{tree})" = "$PREVIOUS_TREE"
            test "$(git rev-parse HEAD^)" = "$EXPECTED_HEAD"
          fi
          git apply --check --whitespace=error-all "$RUNNER_TEMP/variance-debugger.patch"
          git apply --index --whitespace=error-all "$RUNNER_TEMP/variance-debugger.patch"
          npm run build:workers
          npm run build:sdk
          git add -A
          git diff --cached --check
          test "$(git write-tree)" = "$EXPECTED_TREE"
      - name: Validate publication
        run: |
          set -o pipefail
          npm run check 2>&1 | tee "$RUNNER_TEMP/variance-check.log"
          node --test --test-concurrency=4 tests/*.test.js > "$RUNNER_TEMP/variance-tests.log" 2>&1
          tail -n 12 "$RUNNER_TEMP/variance-tests.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: variance-delivery-diagnostics
          path: |
            ${{ runner.temp }}/variance-check.log
            ${{ runner.temp }}/variance-tests.log
          retention-days: 7
      - name: Commit and non-force push
        run: |
          test "$(git write-tree)" = "$EXPECTED_TREE"
          git config user.name 'Wiesław Šoltés'
          git config user.email 'wieslawsoltes@users.noreply.github.com'
          git commit -m 'feat: infer nominal variance with deterministic debugger regressions'
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          git rev-parse HEAD HEAD^{tree}
