name: Publish compiler continuation
on:
  push:
    branches: [automation/compiler-continuation-20261009]
    paths: [.github/continuation-payload.json]
permissions:
  contents: write
  actions: write
concurrency:
  group: compiler-continuation-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify and publish plain-text compiler patches
        id: publish
        run: |
          python3 - <<'PY'
          import hashlib, json, os, re, subprocess, tempfile
          from pathlib import Path
          evidence = Path(os.environ['RUNNER_TEMP']) / 'compiler-continuation'
          evidence.mkdir()
          payload = json.loads(Path('.github/continuation-payload.json').read_text())
          target, expected = payload['target'], payload['base']
          if target not in ['feat/compiler-generic-impls', 'feat/compiler-generic-traits', 'feat/compiler-supertraits']:
              raise SystemExit('Unexpected feature branch')
          if not re.fullmatch('[0-9a-f]{40}', expected) or not 1 <= len(payload['commits']) <= 16:
              raise SystemExit('Invalid publication manifest')
          for change in payload['commits']:
              if not re.fullmatch(r'\.github/continuation-[a-z0-9-]+\.patch', change['path']):
                  raise SystemExit('Invalid plain-text patch path')
              data = Path(change['path']).read_bytes()
              if len(data) > 2000000 or hashlib.sha256(data).hexdigest() != change['sha256']:
                  raise SystemExit('Patch digest or size mismatch')
              change['patch'] = data.decode('utf-8')
          (evidence / 'payload.json').write_text(json.dumps(payload))
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          if git('ls-remote', 'origin', 'refs/heads/' + target).split()[0] != expected:
              raise SystemExit('Target branch moved; no concurrent work will be overwritten')
          git('config', 'user.name', 'Wiesław Šoltés')
          git('config', 'user.email', 'wieslawsoltes@users.noreply.github.com')
          git('checkout', '--detach', expected)
          for change in payload['commits']:
              with tempfile.NamedTemporaryFile(mode='w', suffix='.patch') as patch:
                  patch.write(change['patch']); patch.flush()
                  git('apply', '--index', '--whitespace=error', patch.name)
              paths = git('diff', '--cached', '--name-only').splitlines()
              if not paths or any(not p.startswith(('src/compiler/', 'tests/', 'docs/', 'tools/')) for p in paths):
                  raise SystemExit('Only compiler, test, documentation and tool sources may be published')
              subprocess.run(['npm', 'run', 'build:workers'], check=True)
              subprocess.run(['npm', 'run', 'build:sdk'], check=True)
              git('add', 'src/ui/workers', 'src/sdk/ferrite.bundle.js')
              if git('write-tree') != change['tree']:
                  raise SystemExit('Compiler source tree mismatch: ' + git('write-tree'))
              git('commit', '-m', change['message'])
          git('archive', '--format=zip', 'HEAD', '-o', str(evidence / 'checkout.zip'))
          (evidence / 'commit.txt').write_text(git('rev-parse', 'HEAD'))
          (evidence / 'tree.txt').write_text(git('write-tree'))
          subprocess.run(['npm', 'run', 'check'], check=True)
          subprocess.run(['npm', 'test'], check=True)
          git('push', 'origin', 'HEAD:refs/heads/' + target)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('target=' + target + '\n')
          Path(os.environ['GITHUB_STEP_SUMMARY']).write_text('Published `' + git('rev-parse', 'HEAD') + '`; exact tree `' + git('write-tree') + '`.\n')
          PY
      - name: Run complete feature validation
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ steps.publish.outputs.target }}
        run: gh workflow run test.yml --ref "$TARGET"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compiler-continuation
          path: ${{ runner.temp }}/compiler-continuation/
          retention-days: 7
