name: Publish associated type continuation
on:
  push:
    branches: [automation/compiler-associated-types-delivery]
    paths: ['.github/workflows/associated-types-delivery.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_HEAD: 92f7ea29a9879687644103b70eb8d765ea4b004c
      EXPECTED_TREE: c885d3e7103fb8e12f6f9ab41a1c3ae24cf08215
      TARGET_BRANCH: feat/compiler-associated-types
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Decode verified source patch
        run: |
          python3 - <<'PY'
          import base64, hashlib, lzma, os
          from pathlib import Path
          text = ''.join(Path(f'.compiler-transfer/types.{i}.b64').read_text().strip() for i in range(1, 4))
          patch = lzma.decompress(base64.b64decode(text, validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'f141bf643bd94a2d8d4e4b0c7da14d560bd157b44cd5662c6526e2df2d8c7d78'
          Path(os.environ['RUNNER_TEMP'], 'associated-types.patch').write_bytes(patch)
          PY
      - uses: actions/checkout@v4
        with:
          ref: feat/compiler-associated-types
      - name: Apply and regenerate exact source tree
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git apply --check --whitespace=error-all "$RUNNER_TEMP/associated-types.patch"
          git apply --index --whitespace=error-all "$RUNNER_TEMP/associated-types.patch"
          npm run build:workers
          npm run build:sdk
          git add -A
          git diff --cached --check
          test "$(git write-tree)" = "$EXPECTED_TREE"
      - name: Validate publication
        run: |
          set -o pipefail
          npm run check 2>&1 | tee "$RUNNER_TEMP/check.log"
          node --test --test-concurrency=4 tests/*.test.js > "$RUNNER_TEMP/tests.log" 2>&1
          tail -n 12 "$RUNNER_TEMP/tests.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: associated-types-publication-evidence
          path: |
            ${{ runner.temp }}/check.log
            ${{ runner.temp }}/tests.log
          retention-days: 7
      - name: Commit and non-force push feature branch
        run: |
          test "$(git write-tree)" = "$EXPECTED_TREE"
          git config user.name 'Wiesław Šoltés'
          git config user.email 'wieslawsoltes@users.noreply.github.com'
          git commit -m 'feat: normalize Rust associated types through checked trait contracts'
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          git rev-parse HEAD HEAD^{tree}
