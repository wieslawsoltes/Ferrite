name: Apply compiler-output browser regression update
on:
  push:
    branches: [fix/compiler-output-visualizations]
    paths: ['.github/compiler-results/**']
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply reviewed mobile test delta
        run: |
          set -euo pipefail
          echo '53eae210eff8a0b478195baeddf98820a3ee0f34faac62e2a75b327ba78450e7  .github/compiler-results/mobile.patch.gz' | sha256sum --check
          gzip -dc .github/compiler-results/mobile.patch.gz > /tmp/mobile.patch
          git apply --check /tmp/mobile.patch
          git apply --index /tmp/mobile.patch
          git diff --cached --check
          python -m py_compile tools/browser-acceptance.py
      - name: Validate before publishing
        run: |
          npm run check
          npm test
      - name: Publish only the feature branch
        run: |
          git config user.name 'Wiesław Šoltés'
          git config user.email 'wieslawsoltes@users.noreply.github.com'
          git commit -m 'test: verify mobile compiler sidebar transition after explicit sample builds'
          git push origin HEAD:refs/heads/fix/compiler-output-visualizations
