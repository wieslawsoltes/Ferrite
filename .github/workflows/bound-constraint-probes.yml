name: Native associated bound probes
on:
  push:
    branches: [automation/compiler-bound-constraints-delivery]
    paths: ['.github/workflows/bound-constraint-probes.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: rustup toolchain install stable --profile minimal
      - name: Probe associated bound syntax and obligations
        run: |
          python3 - <<'PY'
          import json, pathlib, subprocess, tempfile
          cases = {
            'copy-bound': 'trait A{type Item;}struct S;impl A for S{type Item=u8;}fn f<T:A<Item:Copy>>(x:T::Item)->(T::Item,T::Item){(x,x)}fn main(){let p=f::<S>(7);println!("{} {}",p.0,p.1);}',
            'multiple-bounds': 'trait A{type Item;}struct S;impl A for S{type Item=u8;}fn f<T:A<Item:Copy+std::fmt::Display>>(x:T::Item)->T::Item{println!("{}",x);x}fn main(){println!("{}",f::<S>(7));}',
            'nested-equality': 'trait A{type Item;}trait B{type Out;}struct S;struct V;impl A for S{type Item=V;}impl B for V{type Out=u8;}fn f<T:A<Item:B<Out=u8>>>(x:<<T as A>::Item as B>::Out)->u8{x}fn main(){println!("{}",f::<S>(7));}',
            'copy-failure': 'trait A{type Item;}struct S;impl A for S{type Item=String;}fn f<T:A<Item:Copy>>(){}fn main(){f::<S>();}',
            'repeat-bounds': 'trait A{type Item;}fn f<T:A<Item:Copy,Item:Copy>>(){}fn main(){}',
            'equality-plus-bound': 'trait A{type Item;}fn f<T:A<Item=u8,Item:Copy>>(){}fn main(){}',
            'contradictory-unused': 'trait A{type Item;}fn f<T:A<Item=String,Item:Copy>>(){}fn main(){}',
            'empty-bound': 'trait A{type Item;}struct S;impl A for S{type Item=u8;}fn f<T:A<Item:>>(){}fn main(){f::<S>();}',
            'trailing-plus': 'trait A{type Item;}struct S;impl A for S{type Item=u8;}fn f<T:A<Item:Copy+>>(){}fn main(){f::<S>();}',
            'parenthesized-bound': 'trait A{type Item;}struct S;impl A for S{type Item=u8;}fn f<T:A<Item:(Copy)>>(){}fn main(){f::<S>();}',
            'relaxed-sized-binding': 'trait A{type Item:?Sized;}fn f<T:A<Item:?Sized>>(){}fn main(){}',
            'relaxed-copy-binding': 'trait A{type Item;}fn f<T:A<Item:?Copy>>(){}fn main(){}',
            'unknown-empty-member': 'trait A{type Item;}fn f<T:A<Missing:>>(){}fn main(){}',
            'unknown-nested-bound': 'trait A{type Item;}fn f<T:A<Item:Missing>>(){}fn main(){}',
            'nested-unknown-member': 'trait A{type Item;}trait B{type Out;}fn f<T:A<Item:B<Missing:Copy>>>(){}fn main(){}',
            'supertrait-bound': 'trait A{type Item;}trait B:A<Item:Copy>{}struct S;impl A for S{type Item=u8;}impl B for S{}fn main(){}',
            'supertrait-bad-bound': 'trait A{type Item;}trait B:A<Item:Copy>{}struct S;impl A for S{type Item=String;}impl B for S{}fn main(){}',
            'associated-item-bound': 'trait A{type Item;}trait B{type Out:A<Item:Copy>;}struct S;struct V;impl A for S{type Item=u8;}impl B for V{type Out=S;}fn main(){}',
            'associated-item-bad-bound': 'trait A{type Item;}trait B{type Out:A<Item:Copy>;}struct S;struct V;impl A for S{type Item=String;}impl B for V{type Out=S;}fn main(){}',
            'generic-impl-evidence': 'trait A{type Item;}trait B{type Out:Copy;}struct V<T>(T);impl<T:A<Item:Copy>>B for V<T>{type Out=T::Item;}fn main(){}',
            'generic-impl-missing-evidence': 'trait A{type Item;}trait B{type Out:Copy;}struct V<T>(T);impl<T:A>B for V<T>{type Out=T::Item;}fn main(){}',
            'stricter-impl-method': 'trait A{type Item;}trait B{fn f<T:A>();}struct S;impl B for S{fn f<T:A<Item:Copy>>() {}}fn main(){}',
            'equivalent-impl-method': 'trait A{type Item;}trait B{fn f<T:A<Item:Copy>>();}struct S;impl B for S{fn f<T:A>() where T::Item:Copy {}}fn main(){}',
            'omitted-method-bound-body': 'trait A{type Item;}trait B{fn f<T:A<Item:Copy>>(x:T::Item)->(T::Item,T::Item);}struct S;impl B for S{fn f<T:A>(x:T::Item)->(T::Item,T::Item){(x,x)}}fn main(){}',
            'alias-bound-not-enforced': 'trait A{type Item;}struct S;impl A for S{type Item=String;}type V<T:A<Item:Copy>>=T::Item;fn main(){let x:V<S>=String::from("ok");println!("{}",x);}',
            'nested-output-impl-inference': 'trait A{type Item;}trait B{type Out;}trait C{type Value;}struct S;struct V;impl A for S{type Item=V;}impl B for V{type Out=u8;}impl<T:A<Item:B<Out=U>>,U>C for T{type Value=U;}fn main(){let x:<S as C>::Value=7;println!("{}",x);}',
            'noninjective-bound-input': 'trait A{type Item;}trait B<T>{}trait C{}struct W<T>(T);impl<T:A<Item:B<U>>,U>C for W<T>{}fn main(){}',
            'declared-nested-projection-bound': 'trait A{type Item:B<Out:Copy>;}trait B{type Out;}trait C{type Value:Copy;}struct W<T>(T);impl<T:A>C for W<T>{type Value=<<T as A>::Item as B>::Out;}fn main(){}',
            'declared-nested-projection-equality': 'trait A{type Item:B<Out=u8>;}trait B{type Out;}trait C{type Value:Copy;}struct W<T>(T);impl<T:A>C for W<T>{type Value=<<T as A>::Item as B>::Out;}fn main(){}',
            'recursive-associated-bound': 'trait A{type Item:A;}struct S;impl A for S{type Item=S;}fn f<T:A<Item:A<Item:A>>>(){}fn main(){f::<S>();}',
            'bound-does-not-import-trait': 'mod m{pub trait B{fn get(self)->i32;}pub struct V;impl B for V{fn get(self)->i32{42}}}trait A{type Item;}struct S;impl A for S{type Item=m::V;}fn f<T:A<Item:m::B>>(x:T::Item)->i32{x.get()}fn main(){println!("{}",f::<S>(m::V));}',
            'bound-with-trait-import': 'mod m{pub trait B{fn get(self)->i32;}pub struct V;impl B for V{fn get(self)->i32{42}}}use m::B;trait A{type Item;}struct S;impl A for S{type Item=m::V;}fn f<T:A<Item:B>>(x:T::Item)->i32{x.get()}fn main(){println!("{}",f::<S>(m::V));}',
            'projected-bound-dispatch': 'trait A{type Item;}trait B{fn get(self)->i32;}struct V;impl V{fn get(self)->i32{9}}impl B for V{fn get(self)->i32{42}}struct S;impl A for S{type Item=V;}fn f<T:A<Item:B>>(x:T::Item)->i32{x.get()}fn main(){println!("{}",f::<S>(V));}',
            'inherited-binding-owner': 'trait A{type Item;}trait B:A{}struct S;impl A for S{type Item=u8;}impl B for S{}fn f<T:B<Item:Copy>>(x:T::Item)->(T::Item,T::Item){(x,x)}fn main(){let p=f::<S>(7);println!("{} {}",p.0,p.1);}',
            'child-member-precedence': 'trait A{type Item;}trait B:A{type Item;}struct S;impl A for S{type Item=String;}impl B for S{type Item=u8;}fn f<T:B<Item:Copy>>(){}fn main(){f::<S>();}',
            'ambiguous-binding-owner': 'trait A{type Item;}trait B{type Item;}trait C:A+B{}fn f<T:C<Item:Copy>>(){}fn main(){}',
            'callable-output-bound': 'trait A{type Item;}struct S;impl A for S{type Item=fn(i32)->i32;}fn add(x:i32)->i32{x+1}fn f<T:A<Item:Fn(i32)->i32>>(g:T::Item)->i32{g(41)}fn main(){println!("{}",f::<S>(add));}',
            'return-impl-bound': 'trait A{type Item;}struct S;impl A for S{type Item=u8;}fn f()->impl A<Item:Copy>{S}fn main(){let _x=f();}',
            'bound-label-hygiene': 'trait A{type Item;}trait B<T>{}struct V;impl B<u8> for V{}struct S;impl A for S{type Item=V;}fn f<Item,T:A<Item:B<Item>>>(){}fn main(){f::<u8,S>();}',
            'impl-head-bound-forbidden': 'trait A{type Item;}struct S;impl A<Item:Copy> for S{type Item=u8;}fn main(){}'
          }
          report={'rustc':subprocess.check_output(['rustup','run','stable','rustc','--version','--verbose'],text=True),'cases':[]}
          with tempfile.TemporaryDirectory() as directory:
            source=pathlib.Path(directory,'fixture.rs');binary=pathlib.Path(directory,'fixture')
            for name,code in cases.items():
              source.write_text(code)
              result=subprocess.run(['rustup','run','stable','rustc',str(source),'--edition=2024','-A','warnings','-A','unconditional_panic','-A','arithmetic_overflow','-C','overflow-checks=on','-o',str(binary)],capture_output=True,text=True,timeout=30)
              execution=subprocess.run([str(binary)],capture_output=True,text=True,timeout=5) if result.returncode==0 else None
              item={'name':name,'source':code,'accepted':result.returncode==0,'diagnostics':result.stderr,'output':execution.stdout if execution else None}
              report['cases'].append(item);print(json.dumps(item),flush=True)
          pathlib.Path('native-bound-probes.json').write_text(json.dumps(report,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: native-bound-probes
          path: native-bound-probes.json
          retention-days: 7
