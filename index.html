<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#1e1f22">
  <meta name="description" content="Ferrite: a source-linked Rust compiler laboratory, dockable IDE, executable MIR debugger and optional local native Cargo integration.">
  <title>Ferrite — Rust compiler laboratory</title>
  <link rel="stylesheet" href="./styles/ide.css">
  <link rel="stylesheet" href="./src/vendor/xterm/xterm.css">
  <link rel="stylesheet" href="./styles/agent.css">
  <link rel="stylesheet" href="./styles/workspace.css">
  <link rel="stylesheet" href="./styles/editor-language.css">
  <link rel="stylesheet" href="./styles/designer.css">
</head>
<body>
  <header class="main-toolbar">
    <div class="product-mark" aria-label="Ferrite">Fe</div>
    <button id="project-menu" class="project-switch"><span id="project-name">geometry-lab</span><span class="muted">⌄</span></button>
    <button id="search-everywhere" class="toolbar-search" title="Search Everywhere (Ctrl/Cmd+Shift+P)">Search Everywhere <kbd>⇧ ⌘ P</kbd></button>
    <span class="toolbar-spacer"></span>
    <select id="backend-select" aria-label="Compiler backend"><option value="browser">Ferrite · MIR / JavaScript</option><option value="wasm">WebAssembly · checked host ABI</option><option value="native">Native · installed Cargo</option></select>
    <div id="run-actions" class="toolbar-actions"></div>
    <button id="stop" class="icon-button" title="Stop compilation or execution" aria-label="Stop"></button>
  </header>
  <nav class="workspace-toolbar" aria-label="Workspace actions">
    <div id="file-actions" class="toolbar-actions"></div>
    <span class="toolbar-spacer"></span>
    <label class="toggle-label"><input type="checkbox" id="auto-check" checked>Auto-check</label>
    <label class="toggle-label"><input type="checkbox" id="optimize" checked>Optimize MIR</label>
    <button id="native-connect" class="subtle-button">Native bridge</button>
    <button id="layout-reset" class="icon-button" title="Reset docking layout" aria-label="Reset layout"></button>
  </nav>
  <div class="ide-body">
    <nav class="tool-rail left-rail" id="left-rail" aria-label="Tool windows"></nav>
    <main id="dock-layout" class="dock-layout">
      <aside data-dock="left" class="dock-region dock-left" aria-label="Left tool windows"></aside>
      <div data-resize="left" class="splitter splitter-left"></div>
      <section class="editor-region" aria-label="Editor">
        <div id="document-tabs" class="document-tabs" role="tablist" aria-label="Open documents"></div>
        <div class="editor-breadcrumb"><span id="active-path">src/main.rs</span><span id="editor-language">Rust</span></div>
        <div id="editor-root" class="editor-root"></div>
      </section>
      <div data-resize="right" class="splitter splitter-right"></div>
      <aside data-dock="right" class="dock-region dock-right" aria-label="Right tool windows"></aside>
      <div data-resize="bottom" class="splitter splitter-bottom"></div>
      <section data-dock="bottom" class="dock-region dock-bottom" aria-label="Bottom tool windows"></section>
    </main>
    <nav class="tool-rail right-rail" id="right-rail" aria-label="Compiler tool windows"></nav>
  </div>
  <footer class="statusbar"><span id="status" role="status">Starting compiler…</span><span class="status-spacer"></span><span id="source-position">1:1</span><span>UTF-8</span><span>4 spaces</span><span id="build-version">Ferrite 0.8 · Rust subset</span></footer>
  <input type="file" id="import-input" accept=".json,.ferrite.json" hidden>
  <noscript>Ferrite needs JavaScript enabled. The compiler and source editor run locally in your browser.</noscript>
  <script type="module" src="./src/ui/main.js"></script>
</body>
</html>
