name: Publish verified compiler commits
on:
  push:
    branches: [automation/ferrite-language-publish]
    paths: [.github/compiler-payload.b64]
permissions:
  contents: write
  actions: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore and verify focused feature commits
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib, json, os, re, subprocess, tempfile
          from pathlib import Path
          manifest = json.loads(Path('.github/compiler-payload.b64').read_text())
          if 'inline' in manifest:
              payload = manifest['inline']
          else:
              chunks = manifest['chunks']
              if len(chunks) > 64 or any(not re.fullmatch(r'\.github/compiler-payload-[a-z0-9-]+\.b64', path) for path in chunks):
                  raise SystemExit('Invalid publication chunks')
              encoded = ''.join(Path(path).read_text().strip() for path in chunks)
              for repair in manifest.get('repairs', []):
                  if encoded.count(repair['old']) != 1:
                      raise SystemExit('Transport repair must match exactly once')
                  encoded = encoded.replace(repair['old'], repair['new'], 1)
              compressed = base64.b64decode(encoded, validate=True)
              if hashlib.sha256(compressed).hexdigest() != manifest['sha256']:
                  raise SystemExit('Payload digest mismatch')
              payload = json.loads(gzip.decompress(compressed))
          target = 'feat/compiler-language-toolchain'
          def git(*args, **kwargs):
              return subprocess.check_output(['git', *args], **kwargs).decode().strip()
          expected = payload['base']
          remote = git('ls-remote', 'origin', 'refs/heads/' + target).split()[0]
          if remote != expected:
              raise SystemExit('Target branch moved; refusing to overwrite concurrent work')
          git('config', 'user.name', 'Wiesław Šoltés')
          git('config', 'user.email', 'wieslawsoltes@users.noreply.github.com')
          git('checkout', '--detach', expected)
          for change in payload['commits']:
              if change.get('merge'):
                  merged = subprocess.run(['git', 'merge', '--no-commit', '--no-ff', change['merge']])
                  if merged.returncode:
                      conflicts = git('diff', '--name-only', '--diff-filter=U').splitlines()
                      if not conflicts or any(not re.fullmatch(r'src/ui/workers/[a-z-]+\.bundle\.js', p) for p in conflicts):
                          raise SystemExit('Unexpected source merge conflict')
                      git('checkout', '--ours', '--', *conflicts)
                      git('add', '--', *conflicts)
              if change.get('patch'):
                  with tempfile.NamedTemporaryFile(suffix='.patch') as patch:
                      patch.write(change['patch'].encode()); patch.flush()
                      git('apply', '--index', '--whitespace=error', patch.name)
              subprocess.run(['npm', 'run', 'build:workers'], check=True)
              git('add', 'src/ui/workers')
              tree = git('write-tree')
              if tree != change['tree']:
                  raise SystemExit('Source tree mismatch: ' + tree)
              git('commit', '-m', change['message'])
          subprocess.run(['npm', 'run', 'check'], check=True)
          subprocess.run(['npm', 'test'], check=True)
          git('push', '--force-with-lease=refs/heads/' + target + ':' + expected, 'origin', 'HEAD:refs/heads/' + target)
          head = git('rev-parse', 'HEAD')
          Path(os.environ['GITHUB_STEP_SUMMARY']).write_text('Published `' + head + '` with verified tree `' + git('write-tree') + '`.\nTransport files are isolated from the feature branch.\n')
          print('PUBLISHED_HEAD=' + head)
          PY
      - name: Dispatch the full feature-branch validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run test.yml --ref feat/compiler-language-toolchain
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: compiler-transport-evidence
          path: .github/compiler-payload*.b64
          include-hidden-files: true
          retention-days: 1
