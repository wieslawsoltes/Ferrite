name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Archive exact deployment source
        run: git archive --format=zip HEAD -o "$RUNNER_TEMP/ferrite-source.zip"
      - name: Retain deployment source
        uses: actions/upload-artifact@v4
        with:
          name: ferrite-source
          path: ${{ runner.temp }}/ferrite-source.zip
          retention-days: 7
      - name: Validate all JavaScript modules
        run: node tools/check-syntax.mjs
      - name: Run compiler and project regression tests
        run: npm test
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
