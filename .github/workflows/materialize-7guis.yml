name: Materialize reviewed 7GUIs checkpoint
on:
  push:
    branches: [feat/seven-guis-sample-browser]
    paths: [.github/7guis-checkpoint.patch, .github/workflows/materialize-7guis.yml]
permissions:
  contents: write
concurrency:
  group: seven-guis-checkpoint
  cancel-in-progress: false
jobs:
  checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply reviewed source changes and regenerate deterministic assets
        run: |
          test -f .github/7guis-checkpoint.patch
          # Correct the copied unchanged context line, not the implementation.
          sed -i 's/for (const char of value) { const code = char.codePointAt(0);/for (const c of value) { const code = c.codePointAt(0);/' .github/7guis-checkpoint.patch
          git apply --index .github/7guis-checkpoint.patch
          rm .github/7guis-checkpoint.patch
          git add -u .github/7guis-checkpoint.patch
          if test -f tools/build-seven-guis.mjs; then node tools/build-seven-guis.mjs; fi
          node tools/bundle-workers.mjs
          node tools/bundle-sdk.mjs
          npm run check
          npm test
      - name: Commit validated checkpoint without overwriting concurrent changes
        run: |
          git config user.name 'Wiesław Šoltés'
          git config user.email 'wieslawsoltes@users.noreply.github.com'
          git add src tests examples tools styles docs index.html package.json .github
          git commit -m 'feat(7guis): materialize reviewed source checkpoint and deterministic bundles'
          git push origin HEAD:refs/heads/feat/seven-guis-sample-browser
      - name: Preserve source and commit evidence
        if: always()
        run: |
          mkdir -p artifacts/checkpoint
          git archive HEAD -o artifacts/checkpoint/source.zip
          git rev-parse HEAD > artifacts/checkpoint/commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seven-guis-checkpoint-${{ github.sha }}
          path: artifacts/checkpoint
          retention-days: 14
