name: Apply checked sample formatting
on:
  push:
    branches: [style/readable-samples]
    paths:
      - .github/workflows/sample-format-toolchain.yml
      - tools/sample-format/**
      - tools/format-samples.mjs
      - tools/sample-rustfmt.toml
permissions:
  contents: write
concurrency:
  group: readable-samples-formatting
  cancel-in-progress: false
jobs:
  formatter:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Format and verify all sample sources
        run: |
          rustup toolchain install 1.90.0 --profile minimal --component rustfmt
          node tools/format-samples.mjs
          node tools/format-samples.mjs --check
          npm run check
          npm test
      - name: Commit the verified formatting without overwriting concurrent changes
        run: |
          git config user.name 'Wiesław Šoltés'
          git config user.email 'wieslawsoltes@users.noreply.github.com'
          git add examples rust-ui/example/src src/samples.js src/ui-framework/Samples.js src/ui/model/SampleCatalog.js src/ui/model/SevenGuisCatalog.js src/ui/controllers/ProjectController.js src/ui/workers/*.bundle.js src/sdk/ferrite.bundle.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'style(samples): expand Rust, view markup and CSS into readable multiline sources'
          git push origin HEAD:refs/heads/style/readable-samples
      - name: Archive exact formatted source
        if: always()
        run: |
          mkdir -p artifacts/formatting
          git archive HEAD -o artifacts/formatting/source.zip
          git rev-parse HEAD > artifacts/formatting/commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: formatted-samples-${{ github.sha }}
          path: artifacts/formatting
          retention-days: 7
